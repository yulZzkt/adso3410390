<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01-Events</title>
    <link rel="stylesheet" href="../../src/css/master.css">
    <style>
        body.mainmenu.javascript {
            /* overflow-y: hidden; resolucion segun pc */
            main {
                max-width: 420px;
                header {
                    h1 {
                        font-size: 2.6rem;
                    }
                }
                section{
                    width: 400px;
                    div.ksita{
                        background: url(img/kasa.jpg)
                        no-repeat center / cover;
                        border-radius: 14px;
                        corner-shape:squircle;
                        height: 640px;
                        position: relative;
                        div.info,div.controls,div#trainer{
                            position: absolute;
                        }
                        div.info{
                            background-color: color #000900;
                            color:#fff ;
                            padding: 0.8rem;
                            left: 50%;
                            top: 1rem;
                            text-align: center;
                            font-size: 1.6rem;
                            transform: translateX(-50%);
                            width: 340px;
                        }
                        div.controls{
                            display: flex;
                            gap: 0.4rem;
                            left:50%;
                            transform: translateX(-50%);
                            top: 8rem;
                            button{
                                background-color: #000c;
                                color: #fff;
                                border: none;
                                border-radius: 14px;
                                height: 60px;
                                opacity: 0.8;
                                transition: all 0.2s ease-in;
                                width: 50px;
                                &:hover{
                                    opacity: 1;
                                    cursor: pointer;
                                    transform: scale(1.1);
                                }
                            }
                        }
                        div#trainer{
                            background: url(img/traineer.png) repeat-x;
                            height: 256px;
                            left: 50%;
                            transform: translateX(-50%);
                            zoom: 0.8;
                            bottom: 3rem;
                            width: 256px;

                            animation: 0.6s animTrainer steps(4) infinite;
                            &.down{background-position-y:calc(256px * 0);}
                            &.left{background-position-y:calc(256px * -1);}
                            &.right{background-position-y:calc(256px * -2);}
                            &.up{background-position-y:calc(256px * -3);}
                        }
                    }
                }
            }
        }
        @keyframes animTrainer{
            100% { background-position-x: -1024px ;}
        }
    </style>
</head>

<body class="mainmenu javascript">
    <nav class="back">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#fff" viewBox="0 0 256 256">
                <path
                    d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z">
                </path>
            </svg>
        </a>
    </nav>
    <main>
        <header>
            <h1>01-Events</h1>
            <h3>Hadle user interactions with event listerns.</h3>
        </header>
        <section>
            <div class="ksita">
                <div class="info">
                    press arrow keys: <br>
                    &larr; &uarr; &rarr; &darr;
                </div>
                <div class="controls">
                    <button class="btn-left">&larr;</button>
                    <button class="btn-up">&uarr;</button>
                    <button class="btn-right">&rarr;</button>
                    <button class="btn-down">&darr;</button>
                </div>
                <div id="trainer" class="down"></div>
            </div>
        </section>

    </main>
    <script>
        //elemento
        const trainer = document.getElementById('trainer');
        const btnLeft = document.querySelector('.btn-left');
        const btnUp = document.querySelector('.btn-up');
        const btnRight = document.querySelector('.btn-right');
        const btnDown = document.querySelector('.btn-down');
        //eventos
        btnLeft.addEventListener('click', function() {
            trainer.className = 'left';
        });

        btnUp.addEventListener('click', function() {
            trainer.className = 'up';
        });

        btnRight.addEventListener('click', function() {
            trainer.className = 'right';
        });

        btnDown.addEventListener('click', function() {
            trainer.className = 'down';
        });

    document.addEventListener('keyup', function(event){
            //console.log(event.key)
            //console.log(event.keyCode)
            switch (event.keyCode) {
                case 37: //Left
                    trainer.className = 'left';
                    break;
                case 38: //Up
                    trainer.className = 'up';
                    break;
                case 39: //Right
                    trainer.className = 'right';
                    break;
                case 40: //Down
                    trainer.className = 'down';
                    break;
            }
        });
    </script>
</body>

</html>
